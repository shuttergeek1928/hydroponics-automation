name: CI Build & Test

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-build:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore IoTBackend/IoTBackend.csproj

      - name: Build Backend
        run: dotnet build IoTBackend/IoTBackend.csproj --configuration Release --no-restore

      - name: Build Simulator
        run: dotnet build IoTSimulator/IoTSimulator.csproj --configuration Release

  frontend-build:
    name: Build & Lint Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iot-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: iot-frontend

      - name: Lint Frontend
        run: npm run lint
        working-directory: iot-frontend
        continue-on-error: true

      - name: Build Next.js
        run: npm run build
        working-directory: iot-frontend
